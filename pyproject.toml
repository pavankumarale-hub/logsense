[project]
name = "logsense"
version = "0.1.0"
description = "AI agent for log ingestion, error clustering, and automated root cause analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.34.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "logsense[test]",
]

[project.scripts]
logsense = "logsense.main:cli"
logsense-mcp = "logsense.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logsense"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure unit tests — no I/O, no LLM calls",
    "integration: pipeline tests with mocked LLM responses",
    "live: real LLM calls — run manually with LOGSENSE_LIVE_TESTS=1",
]
addopts = "-m 'unit or integration' --cov=logsense --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
